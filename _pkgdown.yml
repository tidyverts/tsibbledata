url: https://tsibbledata.tidyverts.org

template:
  params:
    bootswatch: cosmo
  includes:
    in_header: |
      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://track.mitchelloharawild.com/js/pa-Mb31K0N_4273UnhO3Lqq3.js"></script>
      <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
      </script>

development:
  mode: auto

authors:
  Mitchell O'Hara-Wild:
    href: https://mitchelloharawild.com
  Rob Hyndman:
    href: http://robjhyndman.com
  Earo Wang:
    href: https://earo.me

navbar:
  type: default
  left:
  - text: Reference
    href: reference/index.html
  - text: News
    href: news/index.html
  right:
  - icon: fa-github fa-lg
    href: https://github.com/tidyverts/tsibbledata

reference:
- title: Datasets
  desc: >
    A diverse collection of datasets.
  contents:
  - ansett
  - vic_elec
  - aus_livestock
  - aus_production
  - aus_retail
  - gafa_stock
  - global_economy
  - hh_budget
  - nyc_bikes
  - olympic_running
  - PBS
  - pelt
  - monash_forecasting_repository
